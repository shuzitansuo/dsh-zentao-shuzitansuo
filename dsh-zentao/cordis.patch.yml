- insert:
    - id: zentao-workbench
      name: '@local/dsh-zentao'
      config:
        baseUrl: 'http://127.0.0.1:8080'
        account: 'your-account'
        password: 'your-password'
        showClosed: true
        chatMode: custom
        assignmentWatch: true
        assignmentIntervalMs: 60000
        updateUrl: 'https://raw.githubusercontent.com/shuzitansuo/dsh-zentao-shuzitansuo/main/latest.json'
