- insert:
    - id: zentao-workbench
      name: '@local/dsh-zentao'
      config:
        baseUrl: 'http://127.0.0.1:8080'
        account: 'your-account'
        password: 'your-password'
        showClosed: true
        chatMode: custom
        assignmentWatch: true
        assignmentIntervalMs: 60000
        updateUrl: 'https://api.github.com/repos/shuzitansuo/dsh-zentao-shuzitansuo/contents/latest.json?ref=main'
        deepseekApiKey: ''
        deepseekBaseUrl: 'https://api.deepseek.com'
        deepseekModel: 'deepseek-chat'
